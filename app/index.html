<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 노치가 있는 기기에서 safe-area까지 화면을 채운다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>모아 — 청년저축플랫폼</title>
    <meta name="description" content="청년의 조건에 맞는 적금 상품과 청년정책을 찾아주고 저축 플랜을 관리하는 서비스입니다." />
    <meta name="robots" content="noindex, nofollow" />

    <!-- 홈 화면에 추가했을 때 주소창 없이 전체화면으로 실행 (iOS Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="모아" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#17633d" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <style>
      html, body { height: 100%; margin: 0; }
      #root { height: 100%; }
      /* 홈 화면 실행 시 상단 노치 영역이 콘텐츠와 겹치지 않게 한다 */
      body { background: #f7f8f5; }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
