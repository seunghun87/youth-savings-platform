services:
  # ─────────────────────────────────────────────
  # 프론트엔드 (정적 사이트)
  # 아이폰은 앱 설치가 불가능하므로 이 주소를 Safari로 열어 사용한다.
  # ("공유 → 홈 화면에 추가"를 하면 아이콘이 생기고 전체화면으로 뜬다)
  # 안드로이드 APK도 같은 코드를 빌드하므로 화면은 동일하다.
  # ─────────────────────────────────────────────
  - type: web
    runtime: static
    name: youth-savings-web
    branch: main
    rootDir: app
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # 배포된 백엔드 주소. 첫 배포로 백엔드 주소가 정해진 뒤 여기에 입력한다.
      # 예) https://youth-savings-backend.onrender.com
      # (스킴을 빠뜨려도 앱에서 https를 붙이므로 호스트명만 넣어도 동작한다)
      - key: VITE_API_BASE_URL
        sync: false
      # Supabase 공개 설정. anon 키는 RLS로 보호되므로 브라우저 노출이 전제된 값이다
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # SPA: 어떤 경로로 들어와도 index.html을 돌려준다
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer

  # ─────────────────────────────────────────────
  # 백엔드 API
  # ─────────────────────────────────────────────
  - type: web
    name: youth-savings-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    rootDir: app/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # ── Supabase (대시보드에서 직접 입력) ──
      - key: SUPABASE_URL
        sync: false
      # service_role 키는 RLS를 우회하는 전체 권한 키다. 절대 프론트엔드에 넣지 말 것
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── 외부 Open API 인증키 (대시보드에서 직접 입력) ──
      - key: FINLIFE_API_KEY
        sync: false
      - key: YOUTH_POLICY_API_KEY
        sync: false

      # ── 필수 보안 설정 ──
      # 허용할 웹 프론트엔드 출처. 위 정적 사이트 주소를 입력한다.
      # 예) https://youth-savings-web.onrender.com (여러 개면 콤마로 구분)
      # (Capacitor 앱의 출처는 코드에서 항상 허용하므로 여기 적을 필요 없다)
      - key: CORS_ORIGIN
        sync: false
      # /api/*/sync 호출에 필요한 x-sync-secret 값. Render가 자동 생성한다.
      # 미설정 시 동기화 API가 503으로 막혀 상품·정책 데이터를 갱신할 수 없다.
      - key: SYNC_SECRET
        generateValue: true
      # Render는 리버스 프록시 뒤에서 앱을 실행한다. 이 값이 없으면 rate limit이
      # 프록시 IP 하나로 묶여 전체 사용자가 같은 요청 한도를 공유하게 된다.
      - key: TRUST_PROXY
        value: 1

      - key: PORT
        value: 3000
